recalculate:

import_history:
  fields:
    days:
      default: 28
      selector:
        number:
          min: 1
          max: 28
          unit_of_measurement: d
    source_entity:
      selector:
        entity:
          domain: sensor
          device_class: power
    battery_power_history:
      selector:
        entity:
          domain: sensor
          device_class: power
          multiple: true
    replace:
      default: false
      selector:
        boolean:

adjust_forecast:
  fields:
    name:
      example: Vacation
      selector:
        text:
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    duration:
      selector:
        duration:
    factor:
      example: 0.3
      selector:
        number:
          min: 0
          max: 10
          step: 0.05
          mode: box
    offset_w:
      example: 2000
      selector:
        number:
          min: -50000
          max: 50000
          step: 1
          unit_of_measurement: W
          mode: box
    power_w:
      selector:
        number:
          min: 0
          max: 50000
          step: 1
          unit_of_measurement: W
          mode: box
    energy_kwh:
      example: 1.5
      selector:
        number:
          min: -500
          max: 500
          step: 0.1
          unit_of_measurement: kWh
          mode: box
    part_of_forecast:
      default: false
      selector:
        boolean:

clear_forecast_adjustments:
  fields:
    id:
      selector:
        text:
          multiple: true
    name:
      selector:
        text:
          multiple: true

set_forecast_correction:
  fields:
    kind:
      required: true
      selector:
        select:
          options: [consumption, pv, price, all]
          translation_key: forecast_kind
    mode:
      required: true
      selector:
        select:
          options: [learned, "off", manual]
          translation_key: correction_mode
    value:
      example: 0.85
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.001
          mode: box
    bucket:
      default: all
      selector:
        select:
          options: [all, 0-1h, 1-6h, 6-24h, 1-2d, 2-3d, 3-5d, 5d-plus]
          translation_key: lead_time
    duration:
      selector:
        duration:

exclude_consumption_days:
  fields:
    dates:
      required: true
      example: '["2026-11-14"]'
      selector:
        date:
    include:
      default: false
      selector:
        boolean:

reset_forecast_accuracy:
  fields:
    kind:
      default: all
      selector:
        select:
          options: [consumption, pv, price, all]
          translation_key: forecast_kind

set_plan_mode:
  fields:
    mode:
      required: true
      selector:
        select:
          options: [nom, arbitrage, arbitrage_full, time_slots, manual]
          translation_key: plan_mode
          custom_value: true
