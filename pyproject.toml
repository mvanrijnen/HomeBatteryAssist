[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# Line length is handled by the formatter (as in Home Assistant core).
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.homebatteryassist"]
